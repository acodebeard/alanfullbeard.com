# Preserve the legacy Red Meat traversal guard before any redirects.
RewriteEngine On
RewriteCond %{THE_REQUEST} "^\S+\s/+redmeat/\.\./" [NC]
RewriteRule ^ - [F]
RewriteCond %{THE_REQUEST} "(?:%2e){2}" [NC]
RewriteRule ^ - [F]
RewriteRule ^redmeat/\.\.(?:/|$) - [F]

# The former standalone FileHub is retired. Private files are available only
# through the authenticated WordPress administration feature.
RewriteRule ^filehub(?:/|$) - [R=404,L]

# Keep the static deployment health check directly reachable.
RewriteCond %{THE_REQUEST} \s/health\.txt [NC]
RewriteRule ^ - [L]

# HTTPS is enabled at cutover, after the certificate is installed.

# Serve existing protected applications and mapped site roots directly.
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# WordPress front controller for main-domain routes.
# BEGIN WordPress
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
RewriteBase /
RewriteRule ^index\.php$ - [L]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule . /index.php [L]
</IfModule>
# END WordPress

# Add HSTS and upgrade-insecure-requests only to the eventual TLS vhost, never
# to this HTTP pilot.

# Long-lived immutable assets.
<IfModule mod_expires.c>
  ExpiresActive On
</IfModule>
<FilesMatch "\.(woff2)$">
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </IfModule>
  ExpiresDefault "access plus 1 year"
</FilesMatch>
<FilesMatch "\.(webp|avif|png|jpg|jpeg|gif|svg)$">
  <IfModule mod_headers.c>
    Header set Cache-Control "public, max-age=31536000, immutable"
  </IfModule>
  ExpiresDefault "access plus 1 year"
</FilesMatch>

# Dynamic documents must be revalidated.
<IfModule mod_headers.c>
  <FilesMatch "\.(?:html|php)$">
    Header set Cache-Control "max-age=0, must-revalidate"
  </FilesMatch>
</IfModule>
FileETag MTime Size

# Never list directories or serve sensitive project/runtime files.
Options -Indexes
<FilesMatch "(^error_log$|^wp-config\.php$|^xmlrpc\.php$|^readme\.html$|^license\.txt$|\.(log|sql|sqlite|db|bak|old|orig|save|swp|env|key|pem|phtml|php[0-9]+|phar)$)">
  Require all denied
</FilesMatch>
RedirectMatch 404 "(^|/)\.(?!well-known(?:/|$))"
RedirectMatch 404 "(^|/)audit\.php$"
