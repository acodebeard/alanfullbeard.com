[alanfullbeard]

user = afullbeard
group = afullbeard

listen = /run/php/php8.3-fpm-alanfullbeard.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 20s
pm.max_requests = 500

catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php

env[HOME] = /home/afullbeard
env[TMP] = /home/afullbeard/tmp
env[TMPDIR] = /home/afullbeard/tmp
env[TEMP] = /home/afullbeard/tmp

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/afullbeard/logs/php-error.log
php_admin_value[session.save_path] = /home/afullbeard/tmp/sessions
php_admin_value[upload_tmp_dir] = /home/afullbeard/tmp/uploads
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 60
php_admin_value[max_input_vars] = 1000
php_admin_value[post_max_size] = 12M
php_admin_value[upload_max_filesize] = 10M
php_admin_flag[zlib.output_compression] = off
