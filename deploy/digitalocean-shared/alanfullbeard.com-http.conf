<VirtualHost *:80>
    ServerName alanfullbeard.com
    ServerAlias www.alanfullbeard.com
    DocumentRoot /srv/www/alanfullbeard.com/public

    <Directory /srv/www/alanfullbeard.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        LimitRequestBody 12582912
    </Directory>

    <FilesMatch "(^error_log$|^wp-config\.php$|^xmlrpc\.php$|^readme\.html$|^license\.txt$|\.(?:log|sql|sqlite|db|bak|old|orig|save|swp|env|key|pem|phtml|php[0-9]+|phar)$)">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-alanfullbeard.sock|fcgi://localhost/"
    </FilesMatch>

    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    ErrorLog ${APACHE_LOG_DIR}/alanfullbeard.com-error.log
    CustomLog ${APACHE_LOG_DIR}/alanfullbeard.com-access.log combined
</VirtualHost>
